<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Authentication</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <main>
        <h1>JWT Authentication</h1>

        <div class="columns">
            <section class="panel">
                <h2>Вход</h2>
                <form id="loginForm">
                    <label for="loginUsername">Логин:</label>
                    <input id="loginUsername" value="admin" required>
                    <label for="loginPassword">Пароль:</label>
                    <input id="loginPassword" type="password" value="admin123" required>
                    <button type="submit">Войти</button>
                </form>

                <h2>Регистрация</h2>
                <form id="registerForm">
                    <label for="registerUsername">Логин:</label>
                    <input id="registerUsername" required minlength="3">
                    <label for="registerPassword">Пароль:</label>
                    <input id="registerPassword" type="password" required minlength="6">
                    <label for="registerRole">Роль:</label>
                    <select id="registerRole">
                        <option>User</option>
                        <option>Moderator</option>
                    </select>
                    <button class="secondary" type="submit">Зарегистрироваться</button>
                </form>
            </section>

            <section class="panel">
                <h2>JWT Токен</h2>
                <pre id="token">Токен не получен</pre>

                <h2>Тестирование доступа</h2>
                <div class="endpoint-grid">
                    <button data-endpoint="profile">Профиль</button>
                    <button data-endpoint="user-data">User Data</button>
                    <button data-endpoint="admin-data">Admin Data</button>
                    <button data-endpoint="moderator-data">Moderator Data</button>
                </div>

                <h2>Результат запроса</h2>
                <pre id="result">Нажмите кнопку для тестирования...</pre>
            </section>
        </div>

        <section class="panel quick-tests">
            <h2>Быстрые тесты</h2>
            <div class="quick-grid">
                <button data-user="admin" data-password="admin123">Войти как Admin</button>
                <button data-user="user" data-password="user123">Войти как User</button>
                <button data-user="moderator" data-password="moderator123">Войти как Moderator</button>
                <button class="danger" id="clearToken">Очистить токен</button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
